name: Documentation checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"

      - name: Check chapter structure and local links
        run: python3 scripts/check_docs.py

  publish-preview:
    name: Build publication formats
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Pandoc
        uses: pandoc/actions/setup@v1
        with:
          version: "3.13"

      - name: Install PDF renderer
        run: python -m pip install --disable-pip-version-check weasyprint==70.0

      - name: Build and verify publication artifacts
        run: python scripts/build_book.py --formats html epub docx pdf

      - name: Upload publication preview
        uses: actions/upload-artifact@v7
        with:
          name: developer-handbook-${{ github.sha }}
          path: build/
          if-no-files-found: error
          retention-days: 14
