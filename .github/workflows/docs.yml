name: Documentation checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * 3"

permissions:
  contents: read

jobs:
  validate:
    name: Validate Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25
        with:
          globs: "**/*.md"

      - name: Check chapter structure and local links
        run: python3 scripts/check_docs.py

  build-site:
    name: Build searchable website
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install website dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-docs.txt

      - name: Build and verify website
        run: python scripts/build_site.py

      - name: Upload website preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: developer-handbook-site-${{ github.sha }}
          path: build/site/
          if-no-files-found: error
          retention-days: 14

      - name: Package GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: build/site/

  publish-preview:
    name: Build publication formats
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Set up Pandoc
        uses: pandoc/actions/setup@86321b6dd4675f5014c611e05088e10d4939e09e # v1
        with:
          version: "3.13"

      - name: Install PDF renderer
        run: python -m pip install --disable-pip-version-check weasyprint==70.0

      - name: Build and verify publication artifacts
        run: python scripts/build_book.py --formats html epub docx pdf

      - name: Upload publication preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: developer-handbook-${{ github.sha }}
          path: build/
          if-no-files-found: error
          retention-days: 14

  deploy-pages:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  maintenance-report:
    name: Track publication health
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [validate, build-site, publish-preview]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      VALIDATE_RESULT: ${{ needs.validate.result }}
      SITE_RESULT: ${{ needs.build-site.result }}
      PUBLICATION_RESULT: ${{ needs.publish-preview.result }}
    steps:
      - name: Open, update, or resolve publication health issue
        run: |
          title="[Automation] Publication checks need review"
          issue_number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title --jq '.[] | select(.title == "[Automation] Publication checks need review") | .number' | head -n 1)"

          if [ "$VALIDATE_RESULT" = success ] && [ "$SITE_RESULT" = success ] && [ "$PUBLICATION_RESULT" = success ]; then
            if [ -n "$issue_number" ]; then
              gh issue close "$issue_number" --repo "$GITHUB_REPOSITORY" --reason completed
            fi
            exit 0
          fi

          report="$RUNNER_TEMP/publication-health.md"
          {
            echo "The current main branch did not pass every publication check. Inspect the failed job before changing source or build dependencies."
            echo
            echo "[Workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo
            echo '| Check | Result |'
            echo '| --- | --- |'
            echo "| Markdown and local links | $VALIDATE_RESULT |"
            echo "| Searchable website | $SITE_RESULT |"
            echo "| Downloadable formats | $PUBLICATION_RESULT |"
          } > "$report"

          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --repo "$GITHUB_REPOSITORY" --body-file "$report" --add-assignee superflyad
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$report" --assignee superflyad
          fi
